apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
  namespace: lomax
spec:
  replicas: 1
  selector:
    matchLabels: {app: proxy}
  template:
    metadata:
      labels: {app: proxy}
    spec:
      containers:
        - name: proxy
          image: __ECR_PROXY__
          imagePullPolicy: Always
          ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: proxy
  namespace: lomax
spec:
  type: NodePort
  selector: {app: proxy}
  ports: [{port: 80, targetPort: 80, nodePort: 30080}]
