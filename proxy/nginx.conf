server {
    listen 80;
    client_max_body_size 8m;

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
